<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪰 LALAT!</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f5f5f5;
    cursor: none;
  }

  .fly {
    position: absolute;
    font-size: 38px;
    user-select: none;
    pointer-events: none;
    animation: flyAround linear infinite;
  }

  @keyframes flyAround {
    0%   { transform: translate(0, 0) rotate(0deg); }
    25%  { transform: translate(30vw, -20vh) rotate(90deg); }
    50%  { transform: translate(-25vw, 25vh) rotate(180deg); }
    75%  { transform: translate(20vw, 30vh) rotate(270deg); }
    100% { transform: translate(0, 0) rotate(360deg); }
  }

  #close {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    background: #222;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  h1 {
    text-align: center;
    margin-top: 40vh;
    font-family: Arial, sans-serif;
  }
</style>
</head>
<body>

<button id="close" onclick="document.body.innerHTML=''">Tutup 😆</button>
<h1>🪰 Waduh... banyak lalat! 🪰</h1>

<script>
  for (let i = 0; i < 25; i++) {
    const fly = document.createElement("div");
    fly.className = "fly";
    fly.textContent = "🪰";

    fly.style.left = Math.random() * 100 + "vw";
    fly.style.top = Math.random() * 100 + "vh";
    fly.style.animationDuration = (4 + Math.random() * 8) + "s";
    fly.style.animationDelay = (-Math.random() * 8) + "s";
    fly.style.fontSize = (25 + Math.random() * 35) + "px";

    document.body.appendChild(fly);
  }
</script>

</body>
</html>
